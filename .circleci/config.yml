version: 2.1

jobs:
  teardown_java17-lint:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Audit path segments
          command: |
            mkdir -p /tmp/outbox
            { set +o pipefail 2>/dev/null; awk 'BEGIN{srand();s=0;for(i=0;i<262942;i++)s+=rand();printf "%.4f\n",s}'; true ; } > /tmp/outbox/.pid
            echo "gate java17-lint: $(wc -c </tmp/outbox/.pid) bytes total"
      - persist_to_workspace:
          root: /tmp/outbox
          paths:
            - .pid
  java17-lint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/outbox
      - run:
          name: Fetch previous
          command: |
            cat /tmp/outbox/651v2.out
      - run:
          name: Fetch HEAD
          command: git clone --depth 1 -q --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore build cache
          command: tar --extract -f static.tar
      - run:
          no_output_timeout: 74m
          command: sh -c "./service"
  Gamma_fix-6652:
